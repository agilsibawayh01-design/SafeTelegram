name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeTelegram-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    runs-on: ubuntu-latest
    # Requires 4 repository secrets to be configured first (Settings > Secrets
    # and variables > Actions): SAFE_TELEGRAM_KEYSTORE_BASE64,
    # SAFE_TELEGRAM_KEYSTORE_PASSWORD, SAFE_TELEGRAM_KEY_ALIAS,
    # SAFE_TELEGRAM_KEY_PASSWORD. Without them, ./gradlew assembleRelease
    # fails loudly (by design — see app/build.gradle.kts) instead of
    # producing an unsigned/insecurely-signed APK.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        # Written to $RUNNER_TEMP (outside the git checkout) so it can never
        # accidentally end up committed, cached, or included in the APK.
        run: |
          echo "${{ secrets.SAFE_TELEGRAM_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/safetelegram-release.jks"

      - name: Build release APK
        env:
          SAFE_TELEGRAM_KEYSTORE_PATH: ${{ runner.temp }}/safetelegram-release.jks
          SAFE_TELEGRAM_KEYSTORE_PASSWORD: ${{ secrets.SAFE_TELEGRAM_KEYSTORE_PASSWORD }}
          SAFE_TELEGRAM_KEY_ALIAS: ${{ secrets.SAFE_TELEGRAM_KEY_ALIAS }}
          SAFE_TELEGRAM_KEY_PASSWORD: ${{ secrets.SAFE_TELEGRAM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/safetelegram-release.jks"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeTelegram-release-apk
          path: app/build/outputs/apk/release/app-release.apk
